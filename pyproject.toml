[project]
name = "fly-by-wire"
version = "1.0.0"
description = "FlyWire connectome geometry to live CARLA vehicle control"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E402"]
